name: Apply V0.13
on:
  push:
    paths:
      - '.github/workflows/apply-v013.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用V0.13战斗底层补丁
        run: python tools/v013_patch.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/data.js
          node --check src/battle.js
          node --check src/kungfu.js
          node --check src/weapons.js
          node --check src/awakening.js
          node --check src/wudao.js
          node --check src/vip.js
      - name: 提交V0.13
        run: |
          git config user.name "ghzyzttxwd"
          git config user.email "2697941746@qq.com"
          git add src index.html sw.js
          git commit -m "V0.13 补齐异常状态、三渡伏魔圈与控制功法"
          git push
