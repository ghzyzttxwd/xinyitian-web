name: Apply V0.14
on:
  push:
    paths:
      - '.github/workflows/apply-v014.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用V0.14功法机制补丁
        run: python tools/v014_runner.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/kungfu.js
          node --check src/data.js
          node --check src/weapons.js
          node --check src/awakening.js
          node --check src/wudao.js
      - name: 提交V0.14
        run: |
          git config user.name "ghzyzttxwd"
          git config user.email "2697941746@qq.com"
          git add src index.html sw.js
          git commit -m "V0.14 补齐复杂功法战斗机制"
          git push
