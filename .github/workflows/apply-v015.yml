name: Apply V0.15
on:
  push:
    paths:
      - '.github/workflows/apply-v015.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用V0.15神兵熔铸补丁
        run: python tools/v015_patch.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/weapons.js
          node --check src/battle.js
      - name: 提交V0.15
        run: |
          git config user.name "ghzyzttxwd"
          git config user.email "2697941746@qq.com"
          git add src index.html sw.js
          git commit -m "V0.15 补齐神兵熔铸三阶"
          git push
