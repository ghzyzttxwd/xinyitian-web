name: Apply V0.5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v05.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用第一段补丁
        run: python tools/v05_patch1.py
      - name: 应用第二段补丁
        run: python tools/v05_patch2.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/innerpower.js
      - name: 提交V0.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/battle.js index.html sw.js
          git commit -m "完成V0.5内力系统与藏经阁直抽" || exit 0
          git push