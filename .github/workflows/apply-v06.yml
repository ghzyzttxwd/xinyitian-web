name: Apply V0.6
on:
  push:
    paths:
      - '.github/workflows/apply-v06.yml'
      - 'tools/v06_patch.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用神兵补丁
        run: python tools/v06_patch.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/weapons.js
      - name: 提交V0.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/state.js src/battle.js src/weapons.js index.html sw.js
          git rm tools/v06_patch.py .github/workflows/apply-v06.yml
          git commit -m "V0.6：接入神兵系统"
          git push
