name: Apply V0.7
on:
  push:
    paths:
      - '.github/workflows/apply-v07.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用古墓奇遇补丁
        run: python tools/v07_patch.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/ancienttomb.js
          node --check src/weapons.js
          node --check src/innerpower.js
      - name: 提交V0.7
        run: |
          git config user.name "ghzyzttxwd"
          git config user.email "2697941746@qq.com"
          git add src index.html sw.js
          git commit -m "V0.7 古墓奇遇可玩版"
          git push
