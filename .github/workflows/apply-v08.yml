name: Apply V0.8
on:
  push:
    paths:
      - '.github/workflows/apply-v08.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 兼容当前千宝塔奖励行
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app.js');s=p.read_text()
          old="if(milestone.mixedYiqi)reward+=` · 混元一气功 +${milestone.mixedYiqi}`;if(iron)reward+=` · 精铁 +${iron}`;commit();"
          new="if(milestone.mixedYiqi)reward+=` · 混元一气功 +${milestone.mixedYiqi}`;commit();"
          if old not in s: raise SystemExit('tower compatibility marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: 应用神品觉醒补丁
        run: python tools/v08_patch.py
      - name: 恢复千宝塔精铁奖励显示
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app.js');s=p.read_text()
          old="if(milestone.mixedYiqi)reward+=` · 混元一气功 +${milestone.mixedYiqi}`;if(result.floor%100===0)reward+=` · 神品魂石自选箱 +1`;commit();"
          new="if(milestone.mixedYiqi)reward+=` · 混元一气功 +${milestone.mixedYiqi}`;if(iron)reward+=` · 精铁 +${iron}`;if(result.floor%100===0)reward+=` · 神品魂石自选箱 +1`;commit();"
          if old not in s: raise SystemExit('tower restore marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/awakening.js
          node --check src/ancienttomb.js
      - name: 提交V0.8
        run: |
          git config user.name "ghzyzttxwd"
          git config user.email "2697941746@qq.com"
          git add src index.html sw.js
          git commit -m "V0.8 神品觉醒可玩版"
          git push
