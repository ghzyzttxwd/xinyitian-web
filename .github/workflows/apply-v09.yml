name: Apply V0.9
on:
  push:
    paths:
      - '.github/workflows/apply-v09.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用悟道补丁
        run: python tools/v09_patch.py
      - name: 检查脚本语法
        run: |
          node --check src/app.js
          node --check src/state.js
          node --check src/battle.js
          node --check src/wudao.js
          node --check src/awakening.js
          node --check src/ancienttomb.js
      - name: 提交V0.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html sw.js
          git commit -m "V0.9 悟道可玩版"
          git push
