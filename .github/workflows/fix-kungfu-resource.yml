name: Fix Kungfu Equip and Mobile Resources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kungfu-resource.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch equip logic and resource bar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/app.js')
          s=app.read_text()
          old="canEquip=owned&&!used&&kungfuSlotsForTalent(state.heroes[selectedGrowthHero].meridian?.talent||0)>0;"
          new="canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;"
          if s.count(old)!=1: raise SystemExit(f'red equip condition count={s.count(old)}')
          s=s.replace(old,new,1)
          old_decl="requirements=recipe.map(r=>r.kind==='kungfu'?`${r.name} Lv.10`:`${r.name}×${r.count}`).join(' + ');"
          new_decl="requirements=recipe.map(r=>r.kind==='kungfu'?`${r.name} Lv.10`:`${r.name}×${r.count}`).join(' + '),canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;"
          if s.count(old_decl)!=1: raise SystemExit(f'divine declaration count={s.count(old_decl)}')
          s=s.replace(old_decl,new_decl,1)
          old_btn='${owned?`<button class="btn btn-gold" data-equip-divine="${k.id}" ${used?\'disabled\':\'\'}>${used?\'已装备\':\'装备\'}</button>`:'
          new_btn='${owned?`<button class="btn btn-gold" data-equip-divine="${k.id}" ${canEquip?\'\':\'disabled\'}>${used?\'已装备\':\'装备\'}</button>`:'
          if s.count(old_btn)!=1: raise SystemExit(f'divine button count={s.count(old_btn)}')
          s=s.replace(old_btn,new_btn,1)
          app.write_text(s)

          css=Path('styles.css')
          c=css.read_text()
          marker='/* V0.21.1：手机资源栏固定两行 */'
          if marker in c: raise SystemExit('mobile resource patch already present')
          c += '''\n\n/* V0.21.1：手机资源栏固定两行 */\n@media(max-width:600px){\n  .resource-bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;overflow-x:hidden;padding:4px;scrollbar-width:none}\n  .resource-item{min-width:0;width:auto;padding:4px 3px;gap:3px;justify-content:center;text-align:center;border-right:1px solid rgba(210,170,101,.13);overflow:hidden}\n  .resource-item:nth-child(5n){border-right:0}\n  .resource-icon{width:16px;height:16px;flex:0 0 16px}\n  .resource-label{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}\n  .resource-value{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n}\n'''
          css.write_text(c)

          sw=Path('sw.js')
          w=sw.read_text()
          if "xinyitian-v0.21.0" not in w: raise SystemExit('unexpected service worker cache version')
          sw.write_text(w.replace("xinyitian-v0.21.0","xinyitian-v0.21.1",1))
          PY

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq 'canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;' src/app.js
          ! grep -Fq 'kungfuSlotsForTalent(state.heroes[selectedGrowthHero].meridian?.talent||0)>0' src/app.js
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' styles.css
          grep -Fq "xinyitian-v0.21.1" sw.js

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify mobile resources are exactly two rows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/pw/resource.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const r=await p.evaluate(()=>{const bar=document.querySelector('#resourceBar'),items=[...bar.children];return{count:items.length,rows:new Set(items.map(x=>x.offsetTop)).size,overflow:bar.scrollWidth>bar.clientWidth,width:bar.clientWidth,scroll:bar.scrollWidth}});console.log(JSON.stringify(r));if(r.count!==9||r.rows!==2||r.overflow)throw new Error(`resource layout failed ${JSON.stringify(r)}`);await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw && node resource.cjs

      - name: Verify Huangshan can actually equip kungfu
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/xyt-http2.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/pw/kungfu.cjs <<'JS'
          const { chromium }=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});const redId=await p.evaluate(async()=>{const m=await import('/src/state.js');const s=m.createInitialState();const id=Object.keys(s.kungfu.red)[0];s.heroes.huangshan.owned=true;s.heroes.huangshan.meridian.talent=20;s.heroes.huangshan.kungfu.equipped=[null,null,null,null,null,null,null,null];s.kungfu.red[id]={level:1,copies:0};localStorage.setItem('xinyitian_single_v1',JSON.stringify(s));return id});await p.reload({waitUntil:'networkidle'});await p.click('.nav-item[data-page="growth"]');await p.selectOption('#growthHeroSelect','huangshan');await p.click('[data-growth-tab="kungfu"]');const head=await p.locator('.kungfu-main-card .section-title').innerText();console.log('header=',head);assert(head.includes('天赋 260'),`wrong talent ${head}`);assert(head.includes('已开 3/8槽'),`wrong slots ${head}`);assert(await p.locator('.kungfu-slot.open').count()===3,'open slot count != 3');const equip=p.locator(`button[data-equip-kungfu="${redId}"]`);assert(await equip.count()===1,'equip button missing');assert(await equip.isEnabled(),'equip button disabled');await equip.click();assert(await p.locator('[data-unequip-slot="0"]').count()===1,'slot 1 not equipped');const saved=await p.evaluate(()=>JSON.parse(localStorage.getItem('xinyitian_single_v1')));assert(saved.heroes.huangshan.kungfu.equipped[0]===redId,'equipped ref not persisted');assert(errs.length===0,`page errors ${errs.join(' | ')}`);await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw && node kungfu.cjs

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-kungfu-resource.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css sw.js .github/workflows/fix-kungfu-resource.yml
          git commit -m 'fix: equip kungfu and wrap mobile resources'
          git push origin main
