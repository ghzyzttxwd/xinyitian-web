name: Fix Kungfu Equip and Mobile Resources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kungfu-resource.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch equip logic and resource bar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/app.js'); s=app.read_text()
          old="canEquip=owned&&!used&&kungfuSlotsForTalent(state.heroes[selectedGrowthHero].meridian?.talent||0)>0;"
          new="canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;"
          if s.count(old)!=1: raise SystemExit(f'red equip condition count={s.count(old)}')
          s=s.replace(old,new,1)
          old_decl="requirements=recipe.map(r=>r.kind==='kungfu'?`${r.name} Lv.10`:`${r.name}×${r.count}`).join(' + ');"
          new_decl="requirements=recipe.map(r=>r.kind==='kungfu'?`${r.name} Lv.10`:`${r.name}×${r.count}`).join(' + '),canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;"
          if s.count(old_decl)!=1: raise SystemExit(f'divine declaration count={s.count(old_decl)}')
          s=s.replace(old_decl,new_decl,1)
          old_btn='${owned?`<button class="btn btn-gold" data-equip-divine="${k.id}" ${used?\'disabled\':\'\'}>${used?\'已装备\':\'装备\'}</button>`:'
          new_btn='${owned?`<button class="btn btn-gold" data-equip-divine="${k.id}" ${canEquip?\'\':\'disabled\'}>${used?\'已装备\':\'装备\'}</button>`:'
          if s.count(old_btn)!=1: raise SystemExit(f'divine button count={s.count(old_btn)}')
          app.write_text(s.replace(old_btn,new_btn,1))

          css=Path('styles.css'); c=css.read_text(); marker='/* V0.21.1：手机资源栏固定两行 */'
          if marker in c: raise SystemExit('mobile resource patch already present')
          css.write_text(c+'''\n\n/* V0.21.1：手机资源栏固定两行 */\n@media(max-width:600px){\n.resource-bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;overflow-x:hidden;padding:4px;scrollbar-width:none}\n.resource-item{min-width:0;width:auto;padding:4px 3px;gap:3px;justify-content:center;text-align:center;border-right:1px solid rgba(210,170,101,.13);overflow:hidden}\n.resource-item:nth-child(5n){border-right:0}\n.resource-icon{width:16px;height:16px;flex:0 0 16px}\n.resource-label{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}\n.resource-value{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n}\n''')
          sw=Path('sw.js'); w=sw.read_text()
          if "xinyitian-v0.21.0" not in w: raise SystemExit('unexpected cache version')
          sw.write_text(w.replace("xinyitian-v0.21.0","xinyitian-v0.21.1",1))
          PY

      - name: Static checks
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq 'canEquip=owned&&!used&&firstOpenKungfuSlot(selectedGrowthHero)>=0;' src/app.js
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' styles.css

      - name: Install browser runtime
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify mobile resources two rows
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 & P=$!; trap 'kill $P || true' EXIT
          cat >/tmp/pw/r.cjs <<'JS'
          const{chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const r=await p.evaluate(()=>{const x=document.querySelector('#resourceBar'),a=[...x.children];return{n:a.length,rows:new Set(a.map(e=>e.offsetTop)).size,o:x.scrollWidth>x.clientWidth}});if(r.n!==9||r.rows!==2||r.o)throw Error(JSON.stringify(r));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw && node r.cjs

      - name: Verify Huangshan equip chain
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/dev/null 2>&1 & P=$!; trap 'kill $P || true' EXIT
          cat >/tmp/pw/k.cjs <<'JS'
          const{chromium}=require('playwright');const A=(v,m)=>{if(!v)throw Error(m)};(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});const id=await p.evaluate(async()=>{const m=await import('/src/state.js');const s=m.createInitialState(),id=Object.keys(s.kungfu.red)[0];s.heroes.huangshan.owned=true;s.heroes.huangshan.meridian.talent=20;s.heroes.huangshan.kungfu.equipped=Array(8).fill(null);s.kungfu.red[id]={level:1,copies:0};localStorage.setItem('xinyitian_single_v1',JSON.stringify(s));return id});await p.reload({waitUntil:'networkidle'});const r=await p.evaluate(id=>{document.querySelector('.nav-item[data-page="growth"]')?.click();const sel=document.querySelector('#growthHeroSelect');if(!sel)return{stage:'no-select'};sel.value='huangshan';sel.dispatchEvent(new Event('change',{bubbles:true}));const tab=document.querySelector('[data-growth-tab="kungfu"]');if(!tab)return{stage:'no-tab'};tab.click();const head=document.querySelector('.kungfu-main-card .section-title')?.innerText||'';const open=document.querySelectorAll('.kungfu-slot.open').length;const btn=document.querySelector(`button[data-equip-kungfu="${id}"]`);const before={head,open,btn:!!btn,disabled:btn?.disabled??null};if(btn&&!btn.disabled)btn.click();const saved=JSON.parse(localStorage.getItem('xinyitian_single_v1'));return{stage:'done',before,slot:!!document.querySelector('[data-unequip-slot="0"]'),ref:saved.heroes.huangshan.kungfu.equipped[0]};},id);A(r.stage==='done',JSON.stringify(r));A(r.before.head.includes('天赋 260'),JSON.stringify(r));A(r.before.head.includes('已开 3/8槽'),JSON.stringify(r));A(r.before.open===3,JSON.stringify(r));A(r.before.btn,JSON.stringify(r));A(r.before.disabled===false,JSON.stringify(r));A(r.slot,JSON.stringify(r));A(r.ref===id,JSON.stringify(r));A(errs.length===0,errs.join('|'));await b.close()})().catch(e=>{const msg=String(e.message||e).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.error(`::error file=src/app.js,line=1::${msg}`);process.exit(1)});
          JS
          cd /tmp/pw && node k.cjs

      - name: Commit fixes and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-kungfu-resource.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css sw.js .github/workflows/fix-kungfu-resource.yml
          git commit -m 'fix: equip kungfu and wrap mobile resources'
          git push origin main
