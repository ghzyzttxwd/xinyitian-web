name: V02448 Build Xiao Zhao Static Assets

on:
  push:
    branches: [main]
    paths:
      - '.xyt-build-xiaozhao-048'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build official compact assets and runtime
        run: python tools/build_xiaozhao_static.py
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v02448-xiaozhao-static.js
          test -s assets/original/xiaozhao-1000108/role-q82.webp
          test -s assets/original/xiaozhao-1000108/magic-q82.webp
          test -s assets/original/xiaozhao-1000108/meta.json
          test -s assets/original/xiaozhao-1000108/skillname.png
          test -s assets/original/xiaozhao-1000108/4912351.mp3
          grep -F "rootObserver.observe(battleBody,{childList:true,subtree:true})" src/v02448-xiaozhao-static.js
          grep -F "stage.dataset.bvActionDelayMs='4050'" src/v02448-xiaozhao-static.js
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/original/xiaozhao-1000108 src/v02448-xiaozhao-static.js
          git diff --cached --check
          git commit -m 'V0.24.48 build Xiao Zhao static battle assets'
          git push
