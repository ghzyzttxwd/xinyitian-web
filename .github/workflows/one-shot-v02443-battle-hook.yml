name: one-shot-v02443-battle-hook
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-v02443-battle-hook.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Huangshan and Xiao Zhao ultimate hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v02430-battle-visual.js')
          s=p.read_text()
          old="""    const settle=()=>event.structured?applyStructured(event):applyApprox(targets,event,crit,dodged,guarded);
              const isWuji=actor.id==='wuji'||actor.name==='张无忌';
              if(event.normal){
                const targetEl=card(targets[0].name);
                if(isWuji)wujiPunchAttack(actorEl,targetEl,'normal',()=>{addImpact(targetEl,'slash',crit);stageShake(crit);settle();});
                else{dashAttack(actorEl,targetEl);setTimeout(()=>{addImpact(targetEl,'slash',crit);stageShake(crit);settle();},scaled(205));}
              }else if(isWuji){
                // V0.24.30: the cut-in owns the visual order. Targets still come only from chooseTargets/event.targets.
                const targetEls=targets.map(t=>card(t.name)).filter(Boolean);
                const handled=!stage.dispatchEvent(new CustomEvent('xyt-wuji-ultimate',{bubbles:true,cancelable:true,detail:{skill:event.skill||'',targetEls,onImpact:settle}}));
                if(!handled)fallbackWujiSkill(actorEl,targets,crit,settle,event);
              }else if(targets.length===1){
                const targetEl=card(targets[0].name);singleSkillCast(actorEl,targetEl,crit);setTimeout(settle,scaled(350));
              }else{skillCast(actorEl,targets,crit);setTimeout(settle,scaled(180));}
          """
          new="""    const settle=()=>event.structured?applyStructured(event):applyApprox(targets,event,crit,dodged,guarded);
              const isWuji=actor.id==='wuji'||actor.name==='张无忌';
              const isHuangshan=actor.id==='huangshan'||actor.name==='黄衫女';
              const isXiaozhao=actor.id==='xiaozhao'||actor.name==='小昭';
              if(event.normal){
                const targetEl=card(targets[0].name);
                if(isWuji)wujiPunchAttack(actorEl,targetEl,'normal',()=>{addImpact(targetEl,'slash',crit);stageShake(crit);settle();});
                else{dashAttack(actorEl,targetEl);setTimeout(()=>{addImpact(targetEl,'slash',crit);stageShake(crit);settle();},scaled(205));}
              }else if(isWuji){
                // V0.24.30: the cut-in owns the visual order. Targets still come only from chooseTargets/event.targets.
                const targetEls=targets.map(t=>card(t.name)).filter(Boolean);
                const handled=!stage.dispatchEvent(new CustomEvent('xyt-wuji-ultimate',{bubbles:true,cancelable:true,detail:{skill:event.skill||'',targetEls,onImpact:settle}}));
                if(!handled)fallbackWujiSkill(actorEl,targets,crit,settle,event);
              }else if(isHuangshan||isXiaozhao){
                const targetEls=targets.map(t=>card(t.name)).filter(Boolean);
                const eventName=isHuangshan?'xyt-huangshan-ultimate':'xyt-xiaozhao-ultimate';
                const handled=!stage.dispatchEvent(new CustomEvent(eventName,{bubbles:true,cancelable:true,detail:{skill:event.skill||'',targetEls,onImpact:settle}}));
                if(!handled){
                  if(targets.length===1){const targetEl=card(targets[0].name);singleSkillCast(actorEl,targetEl,crit);setTimeout(settle,scaled(350));}
                  else{skillCast(actorEl,targets,crit);setTimeout(settle,scaled(180));}
                }
              }else if(targets.length===1){
                const targetEl=card(targets[0].name);singleSkillCast(actorEl,targetEl,crit);setTimeout(settle,scaled(350));
              }else{skillCast(actorEl,targets,crit);setTimeout(settle,scaled(180));}
          """
          old2="""    if(event.type==='action'){
                if(!event.normal&&event.actor==='张无忌')return scaled(2150);
                return scaled(event.normal?680:900);
              }
          """
          new2="""    if(event.type==='action'){
                if(!event.normal&&event.actor==='张无忌')return scaled(2150);
                if(!event.normal&&event.actor==='黄衫女')return scaled(3650);
                if(!event.normal&&event.actor==='小昭')return scaled(4050);
                return scaled(event.normal?680:900);
              }
          """
          if s.count(old)!=1: raise SystemExit(f'applyAction baseline mismatch: {s.count(old)}')
          if s.count(old2)!=1: raise SystemExit(f'delay baseline mismatch: {s.count(old2)}')
          p.write_text(s.replace(old,new,1).replace(old2,new2,1))
          PY
          node --check src/v02430-battle-visual.js
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-v02443-battle-hook.yml
          git config user.name 'xyt-build-bot'
          git config user.email 'xyt-build-bot@users.noreply.github.com'
          git add src/v02430-battle-visual.js .github/workflows/one-shot-v02443-battle-hook.yml
          git commit -m 'V0.24.43 add original ultimate visual hooks'
          git push origin HEAD:main
