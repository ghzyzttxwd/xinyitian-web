name: Apply V0.24.37 strict slot order
on:
  push:
    paths:
      - '.github/workflows/patch-v02437.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch strict formation order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old,new,1)

          p=Path('src/battle.js')
          s=p.read_text()
          old="""    const order=[];
            const maxSlot=Math.max(5,...player.map(x=>Number(x.slot??-1)),...enemies.map(x=>Number(x.slot??-1)));
            for(let slot=0;slot<=maxSlot;slot++){
              const p=player.find(x=>x.alive&&Number(x.slot??-1)===slot);if(p)order.push(p);
              const e=enemies.find(x=>x.alive&&Number(x.slot??-1)===slot);if(e)order.push(e);
            }"""
          new="""    // V0.24.37: initiative is formation order only. No speed/random/interleaving.
            // Player slots 1→6 act first, then enemy slots 1→6.
            const order=[...slotOrderedAlive(player),...slotOrderedAlive(enemies)];"""
          s=replace_once(s,old,new,'strict slot initiative')
          # Enemy speed is no longer part of battle initiative; remove the dead field from generated enemies.
          s=replace_once(s,
            "side:'enemy',slot:i,atk,def,hp,speed:92+i*2,hit:0,dodge:0,crit:0,antiCrit:0",
            "side:'enemy',slot:i,atk,def,hp,hit:0,dodge:0,crit:0,antiCrit:0",
            'remove generated enemy speed')
          p.write_text(s)

          v=Path('src/v02430-battle-visual.js')
          t=v.read_text()
          t=replace_once(t,
            "if(!event.normal&&event.actor==='张无忌')return scaled(1600);",
            "if(!event.normal&&event.actor==='张无忌')return scaled(2150);",
            'wait for full Wuji ultimate before next actor')
          v.write_text(t)

          i=Path('index.html')
          html=i.read_text()
          if '02436' not in html:
              raise SystemExit('index version marker 02436 missing')
          i.write_text(html.replace('02436','02437'))
          PY
      - name: Syntax and diff check
        run: |
          node --check src/battle.js
          node --check src/v02430-battle-visual.js
          node --check src/v02434-ultimate-cutin.js
          git diff --check
      - name: Commit V0.24.37
        run: |
          git config user.name 'xyt-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/battle.js src/v02430-battle-visual.js index.html
          git diff --cached --check
          git commit -m 'V0.24.37 enforce strict formation turn order'
          git push origin HEAD:main
