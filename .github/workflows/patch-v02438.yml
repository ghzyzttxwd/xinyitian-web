name: Apply V0.24.38 defer assists
on:
  push:
    paths:
      - '.github/workflows/patch-v02438.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch assist timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old,new,1)

          p=Path('src/battle.js')
          s=p.read_text()
          s=replace_once(s,
            "function act(actor,own,enemies,log,round){",
            "function act(actor,own,enemies,log,round,deferAssists=false){",
            'act defer parameter')
          s=replace_once(s,
            "  triggerAssists(actor,own,enemies,log,round);",
            "  if(!deferAssists)triggerAssists(actor,own,enemies,log,round);",
            'defer immediate assists')
          old="""    // V0.24.37: initiative is formation order only. No speed/random/interleaving.
  // Player slots 1→6 act first, then enemy slots 1→6.
  const order=[...slotOrderedAlive(player),...slotOrderedAlive(enemies)];
    for(const actor of order){if(!actor.alive)continue;if(actor.side==='player')act(actor,player,enemies,log,round);else act(actor,enemies,player,log,round);if(!living(player).length||!living(enemies).length)break;}"""
          new="""    // V0.24.38: strict normal-turn order. Assists are deferred until the side's 1→6 normal turns finish.
    const playerOrder=slotOrderedAlive(player);
    for(const actor of playerOrder){
      if(!actor.alive)continue;
      act(actor,player,enemies,log,round,true);
      if(!living(player).length||!living(enemies).length)break;
    }
    if(living(player).length&&living(enemies).length){
      for(const acted of playerOrder){if(acted.actedThisRound&&acted.alive&&living(enemies).length)triggerAssists(acted,player,enemies,log,round);}
    }
    if(living(player).length&&living(enemies).length){
      const enemyOrder=slotOrderedAlive(enemies);
      for(const actor of enemyOrder){
        if(!actor.alive)continue;
        act(actor,enemies,player,log,round,true);
        if(!living(player).length||!living(enemies).length)break;
      }
      if(living(player).length&&living(enemies).length){
        for(const acted of enemyOrder){if(acted.actedThisRound&&acted.alive&&living(player).length)triggerAssists(acted,enemies,player,log,round);}
      }
    }"""
          s=replace_once(s,old,new,'strict side order with deferred assists')
          p.write_text(s)

          i=Path('index.html')
          html=i.read_text()
          if '02437' not in html: raise SystemExit('index 02437 marker missing')
          i.write_text(html.replace('02437','02438'))
          PY
      - name: Syntax and diff check
        run: |
          node --check src/battle.js
          node --check src/v02430-battle-visual.js
          node --check src/v02434-ultimate-cutin.js
          git diff --check
      - name: Commit V0.24.38
        run: |
          git config user.name 'xyt-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/battle.js index.html
          git diff --cached --check
          git commit -m 'V0.24.38 keep assists out of normal slot order'
          git push origin HEAD:main
