name: V0.17 One-shot Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v017-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize patch literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/v017-patch.mjs')
          s=p.read_text()
          s=s.replace(r'\`${event}:\${e.label', r'\`\${event}:\${e.label')
          s=s.replace(r'\`${target.name}', r'\`\${target.name}')
          p.write_text(s)
          PY

      - name: Check patch script
        run: node --check scripts/v017-patch.mjs

      - name: Apply patch
        run: node scripts/v017-patch.mjs

      - name: Syntax check
        run: |
          node --check src/innerpower.js
          node --check src/state.js
          node --check src/ancienttomb.js
          node --check src/battle.js
          node --check src/app.js

      - name: Commit V0.17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete V0.17 inner power system"
          git push origin HEAD:main
