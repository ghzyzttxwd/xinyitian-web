name: V0.18 One-shot Hero UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v018-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply hero UI patch
        run: python scripts/v018-heroes-ui.py

      - name: Syntax check
        run: node --check src/app.js

      - name: Remove temporary patch files
        run: rm -f scripts/v018-heroes-ui.py .github/workflows/v018-one-shot.yml

      - name: Commit V0.18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add V0.18 hero filters and details"
          git push origin HEAD:main
