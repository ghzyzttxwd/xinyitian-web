name: V0.21 Mobile Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v021-mobile-regression.yml'

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq 'firstOpenKungfuSlot(selectedGrowthHero)>=0' src/app.js
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' styles.css
          grep -Fq 'xinyitian-v0.21.1' sw.js

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyt-pw && cd /tmp/xyt-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run 390px mobile interaction regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat >/tmp/xyt-pw/test.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{ if(!v) throw new Error(m); };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const seed={
              version:1,
              player:{level:100,chapter:110,copper:50000000,gems:50000,stamina:100,staminaCap:100,totalRecharge:0,heroExp:500000,meridianPills:99999,breakthroughPills:9999},
              heroes:{huangshan:{owned:true,level:1,exp:0,awakened:false,meridian:{progress:0,atk:0,def:0,hp:0,talent:20},kungfu:{equipped:[null,null,null,null,null,null,null,null]}}},
              kungfu:{red:{'104001':{level:1,copies:0}}}
            };
            await page.addInitScript(s=>localStorage.setItem('xinyitian_single_v1',JSON.stringify(s)),seed);
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});

            const resources=await page.evaluate(()=>{const b=document.querySelector('#resourceBar'),a=[...b.children];return{count:a.length,rows:new Set(a.map(x=>x.offsetTop)).size,overflow:b.scrollWidth>b.clientWidth}});
            assert(resources.count===9,`resource count ${JSON.stringify(resources)}`);
            assert(resources.rows===2,`resource rows ${JSON.stringify(resources)}`);
            assert(!resources.overflow,`resource overflow ${JSON.stringify(resources)}`);
            assert(await page.locator('.party-grid').count()===1,'home party grid missing');

            await page.click('.nav-item[data-page="heroes"]');
            assert(await page.locator('h2', {hasText:'侠客'}).count()>=1,'heroes page missing');
            await page.click('[data-hero-filter="owned"]');
            assert(await page.locator('.hero-list .hero-card').count()>=3,'owned hero filter unexpectedly empty');

            await page.click('.nav-item[data-page="growth"]');
            await page.selectOption('#growthHeroSelect','huangshan');
            await page.click('[data-growth-tab="kungfu"]');
            const kungfuHead=await page.locator('.kungfu-main-card .section-title').innerText();
            assert(kungfuHead.includes('天赋 260'),`huangshan talent wrong: ${kungfuHead}`);
            assert(kungfuHead.includes('已开 3/8槽'),`huangshan slots wrong: ${kungfuHead}`);
            assert(await page.locator('.kungfu-slot.open').count()===3,'huangshan open slot count != 3');
            const equip=page.locator('button[data-equip-kungfu="104001"]');
            assert(await equip.count()===1,'red kungfu equip button missing');
            assert(await equip.isEnabled(),'red kungfu equip button is disabled');
            await equip.scrollIntoViewIfNeeded();
            await equip.click();
            assert(await page.locator('[data-unequip-slot="0"]').count()===1,'kungfu was not equipped into slot 1');
            let saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('xinyitian_single_v1')));
            assert(saved.heroes.huangshan.kungfu.equipped[0]==='104001','equipped kungfu not persisted');
            await page.click('[data-unequip-slot="0"]');
            saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('xinyitian_single_v1')));
            assert(saved.heroes.huangshan.kungfu.equipped[0]===null,'unequip did not persist');

            await page.click('[data-growth-tab="innerPower"]');
            assert((await page.locator('#page').innerText()).includes('内力'),'inner power panel failed');
            await page.click('[data-growth-tab="weapons"]');
            assert((await page.locator('#page').innerText()).includes('神兵'),'weapon panel failed');
            await page.click('[data-growth-tab="meridian"]');
            assert((await page.locator('#page').innerText()).includes('黄衫女 · 经脉'),'meridian panel failed');

            await page.click('.nav-item[data-page="challenge"]');
            const challengeText=await page.locator('#page').innerText();
            assert(challengeText.includes('少林千宝塔'),'tower card missing');
            assert(challengeText.includes('古墓奇遇'),'ancient tomb card missing');

            await page.click('.nav-item[data-page="more"]');
            for(const key of ['inn','tasks','awaken','vip','resources','settings']){
              await page.click(`[data-more-section="${key}"]`);
              assert((await page.locator('#page').innerText()).length>20,`more section ${key} empty`);
              await page.click('[data-more-section="hub"]');
            }

            assert(pageErrors.length===0,`page errors: ${pageErrors.join(' | ')}`);
            await browser.close();
          })().catch(e=>{
            const msg=String(e.stack||e).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
            console.error(`::error file=src/app.js,line=1::${msg}`);
            process.exit(1);
          });
          JS
          cd /tmp/xyt-pw && node test.cjs

      - name: Remove regression workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v021-mobile-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove V0.21 mobile regression'
          git push origin main
