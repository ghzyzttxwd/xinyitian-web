name: V0.21 Original Combat Figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v021-original-figures.yml'

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire original client combat figures
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/original/figure-player.webp
          test -s assets/original/figure-wuji.webp
          test -s assets/original/figure-zhangsanfeng.webp
          echo 'aeb06a8b90b4a0486c6f35f4b9da526ae5441669  assets/original/figure-player.webp' | git hash-object --stdin >/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js'); s=p.read_text()
          old='return `<div class="party-slot"><div class="hero-name rarity-${tpl.rarity}">${tpl.name}</div><div class="hero-meta">Lv.${h.level} · ${tpl.role}</div><div class="hero-meta">战力 ${fmt(heroPower(state,id))}</div></div>`;'
          new='return `<div class="party-slot original-figure-card" data-hero-id="${id}"><div class="hero-name rarity-${tpl.rarity}">${tpl.name}</div><div class="hero-meta">Lv.${h.level} · ${tpl.role}</div><div class="hero-meta">战力 ${fmt(heroPower(state,id))}</div></div>`;'
          if s.count(old)!=1: raise SystemExit(f'party target count={s.count(old)}')
          s=s.replace(old,new,1)
          old='return `<div class="hero-card rarity-card-${tpl.rarity} ${owned?\'\':\'locked\'}"><div class="hero-card-row">'
          new='return `<div class="hero-card rarity-card-${tpl.rarity} ${owned?\'\':\'locked\'} original-figure-card" data-hero-id="${id}"><div class="hero-card-row">'
          if s.count(old)!=1: raise SystemExit(f'hero card target count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          css=Path('styles.css'); c=css.read_text()
          if 'V0.21.3：原版客户端角色战斗切图首批' in c: raise SystemExit('figure css already exists')
          c += '''\n\n/* V0.21.3：原版客户端角色战斗切图首批。图片来自原APK角色PNG动作表裁切，不冒充原版头像框。 */\n.original-figure-card{position:relative;isolation:isolate}\n.original-figure-card::after{content:"";position:absolute;z-index:-1;right:72px;bottom:0;width:82px;height:92%;background-repeat:no-repeat;background-position:right bottom;background-size:contain;opacity:.34;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}\n.party-slot.original-figure-card::after{right:2px;width:64px;height:82%;opacity:.42}\n.original-figure-card[data-hero-id="player"]::after{background-image:url('./assets/original/figure-player.webp')}\n.original-figure-card[data-hero-id="wuji"]::after{background-image:url('./assets/original/figure-wuji.webp')}\n.original-figure-card[data-hero-id="zhangsanfeng"]::after{background-image:url('./assets/original/figure-zhangsanfeng.webp')}\n.original-figure-card>.hero-card-row,.original-figure-card>.hero-name,.original-figure-card>.hero-meta{position:relative;z-index:1}\n@media(max-width:430px){.hero-card.original-figure-card::after{right:5px;top:6px;bottom:auto;width:68px;height:78px;opacity:.28}.party-slot.original-figure-card::after{right:0;bottom:0;top:auto;width:54px;height:70%;opacity:.32}}\n'''
          css.write_text(c)

          sw=Path('sw.js'); w=sw.read_text()
          if 'xinyitian-v0.21.2' not in w: raise SystemExit('unexpected service worker cache')
          w=w.replace('xinyitian-v0.21.2','xinyitian-v0.21.3',1)
          anchor="  './assets/original/icon-stamina.png',"
          repl="  './assets/original/icon-stamina.png',\n  './assets/original/figure-player.webp',\n  './assets/original/figure-wuji.webp',\n  './assets/original/figure-zhangsanfeng.webp',"
          if w.count(anchor)!=1: raise SystemExit('sw asset anchor mismatch')
          sw.write_text(w.replace(anchor,repl,1))
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          file assets/original/figure-player.webp | grep -F 'Web/P image'
          file assets/original/figure-wuji.webp | grep -F 'Web/P image'
          file assets/original/figure-zhangsanfeng.webp | grep -F 'Web/P image'
          grep -Fq 'data-hero-id="${id}"' src/app.js
          grep -Fq 'figure-player.webp' styles.css
          grep -Fq 'xinyitian-v0.21.3' sw.js

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyt-pw && cd /tmp/xyt-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Mobile visual integration regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat >/tmp/xyt-pw/test.cjs <<'JS'
          const {chromium}=require('playwright'); const A=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          for(const id of ['player','wuji']){const el=p.locator(`.party-slot[data-hero-id="${id}"]`);A(await el.count()===1,`party figure ${id} missing`);const bg=await el.evaluate(e=>getComputedStyle(e,'::after').backgroundImage);A(bg.includes(`figure-${id}.webp`),`party figure ${id} bg=${bg}`)}
          await p.click('.nav-item[data-page="heroes"]');
          for(const [id,file] of [['player','player'],['wuji','wuji'],['zhangsanfeng','zhangsanfeng']]){const el=p.locator(`.hero-card[data-hero-id="${id}"]`).first();A(await el.count()===1,`hero figure ${id} missing`);const bg=await el.evaluate(e=>getComputedStyle(e,'::after').backgroundImage);A(bg.includes(`figure-${file}.webp`),`hero figure ${id} bg=${bg}`)}
          const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);A(!overflow,'page has horizontal overflow after figures');A(errs.length===0,`page errors ${errs.join('|')}`);await b.close()})().catch(e=>{console.error(`::error file=styles.css,line=1::${String(e.stack||e).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')}`);process.exit(1)});
          JS
          cd /tmp/xyt-pw && node test.cjs

      - name: Commit integration and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v021-original-figures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css sw.js .github/workflows/v021-original-figures.yml
          git commit -m 'feat: show original combat figures in hero UI'
          git push origin main
