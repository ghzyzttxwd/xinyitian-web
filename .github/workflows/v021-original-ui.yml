name: V0.21 Original UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v021-original-ui.yml'

permissions:
  contents: write

env:
  HOME_BG_B64: ''
  GROWTH_BG_B64: ''
  CHALLENGE_BG_B64: ''
  GEMS_KTX_B64: ''
  COPPER_KTX_B64: ''
  STAMINA_KTX_B64: ''

jobs:
  v021:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert original resource icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v021 assets/original
          printf '%s' "$GEMS_KTX_B64" | base64 -d > /tmp/v021/105.ktx
          printf '%s' "$COPPER_KTX_B64" | base64 -d > /tmp/v021/106.ktx
          printf '%s' "$STAMINA_KTX_B64" | base64 -d > /tmp/v021/107.ktx
          cd /tmp/v021
          curl -fL --retry 3 --connect-timeout 15 -o astcenc.zip 'https://github.com/ARM-software/astc-encoder/releases/download/5.7.0/astcenc-5.7.0-linux-x64.zip'
          echo '6c6b299b17608e1ee74db9c491cdc793b12b2b104a4b52222e358d78ae0662a9  astcenc.zip' | sha256sum -c -
          unzip -q astcenc.zip -d astcenc
          ASTC=$(find astcenc -type f -name astcenc-sse2 | head -n1)
          test -n "$ASTC"
          chmod +x "$ASTC"
          "$ASTC" -ds 105.ktx "$GITHUB_WORKSPACE/assets/original/icon-gems.png"
          "$ASTC" -ds 106.ktx "$GITHUB_WORKSPACE/assets/original/icon-copper.png"
          "$ASTC" -ds 107.ktx "$GITHUB_WORKSPACE/assets/original/icon-stamina.png"
          cd "$GITHUB_WORKSPACE"
          file assets/original/icon-*.png

      - name: Patch V0.21
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          def one(s,a,b,label):
              if s.count(a)!=1: raise SystemExit(f'{label}: expected one, got {s.count(a)}')
              return s.replace(a,b,1)
          p=Path('src/state.js'); s=p.read_text(encoding='utf-8')
          marker="function mergeDefaults(saved, fresh) {"
          helper="function normalizeHeroKungfuStates(state){\n  for(const h of Object.values(state?.heroes||{})){\n    h.kungfu=h.kungfu||{};\n    const eq=Array.isArray(h.kungfu.equipped)?h.kungfu.equipped.slice(0,8):[];\n    while(eq.length<8)eq.push(null);\n    h.kungfu.equipped=eq;\n  }\n}\n\n"
          s=one(s,marker,helper+marker,'state helper')
          s=one(s,"    normalizeDaily(state); recoverStamina(state); recoverInnerPower(state); recalcVip(state);","    normalizeHeroKungfuStates(state); normalizeDaily(state); recoverStamina(state); recoverInnerPower(state); recalcVip(state);",'load normalize')
          s=one(s,"  const state=mergeDefaults(parsed,createInitialState()); normalizeDaily(state); recoverStamina(state); recoverInnerPower(state); recalcVip(state); saveState(state); return state;","  const state=mergeDefaults(parsed,createInitialState()); normalizeHeroKungfuStates(state); normalizeDaily(state); recoverStamina(state); recoverInnerPower(state); recalcVip(state); saveState(state); return state;",'import normalize')
          p.write_text(s,encoding='utf-8')

          p=Path('src/app.js'); s=p.read_text(encoding='utf-8')
          s=one(s,"function resourceItem(label,value){return `<div class=\"resource-item\"><span class=\"resource-label\">${label}</span><span class=\"resource-value\">${value}</span></div>`;}","function resourceItem(label,value,icon=''){return `<div class=\"resource-item\">${icon?`<img class=\"resource-icon\" src=\"./assets/original/${icon}\" alt=\"\" aria-hidden=\"true\">`:''}<span class=\"resource-copy\"><span class=\"resource-label\">${label}</span><span class=\"resource-value\">${value}</span></span></div>`;}",'resource item')
          s=one(s,"resourceItem('铜钱',fmt(state.player.copper))","resourceItem('铜钱',fmt(state.player.copper),'icon-copper.png')",'copper icon')
          s=one(s,"resourceItem('元宝',fmt(state.player.gems))","resourceItem('元宝',fmt(state.player.gems),'icon-gems.png')",'gems icon')
          s=one(s,"resourceItem('体力',`${state.player.stamina}/${state.player.staminaCap}`)","resourceItem('体力',`${state.player.stamina}/${state.player.staminaCap}`,'icon-stamina.png')",'stamina icon')
          slots='''function kungfuEquipSlotsHtml(){
           const h=state.heroes[selectedGrowthHero],talent=heroTalent(state,selectedGrowthHero),slots=kungfuSlotsForTalent(talent),eq=h.kungfu?.equipped||[];
           return `<div class="kungfu-slots">${Array.from({length:8},(_,i)=>{const ref=eq[i],locked=i>=slots;return `<div class="kungfu-slot ${locked?'locked':'open'}"><div class="muted">第${i+1}槽 · ${locked?'未解锁':'已解锁'}</div><div class="hero-name">${locked?'—':(ref?kungfuNameFromRef(ref):'空槽位')}</div>${ref&&!locked?`<button class="btn btn-ghost btn-block" data-unequip-slot="${i}" style="margin-top:6px">卸下</button>`:''}</div>`;}).join('')}</div>`;
          }'''
          s,n=re.subn(r"function kungfuEquipSlotsHtml\(\)\{\n.*?\n\}",slots,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'slots replace={n}')
          panel='''function renderKungfuPanel(){
           const talent=heroTalent(state,selectedGrowthHero),slots=kungfuSlotsForTalent(talent);
           return `<section class="card kungfu-main-card"><div class="section-title"><h3>${HEROES[selectedGrowthHero].name} · 功法</h3><small>天赋 ${fmt(talent)} · 已开 ${slots}/8槽</small></div>${kungfuEquipSlotsHtml()}<div class="notice" style="margin-top:10px">功法槽按总天赋实时解锁：220天赋开启前三槽；280/340/400/460/520依次开启第4～8槽。</div></section>
           <section class="card"><div class="section-title"><h3>藏经阁</h3><small>元宝直接抽取</small></div><div class="notice">300元宝抽1次，1500元宝抽5次。红色功法概率按当前原版元宝抽取的2%处理；低品质结果暂折算为功法残页。</div><div class="action-row" style="margin-top:10px"><button class="btn" data-action="drawKungfu1" ${state.player.gems<300?'disabled':''}>抽1次 · 300元宝</button><button class="btn btn-gold" data-action="drawKungfu5" ${state.player.gems<1500?'disabled':''}>抽5次 · 1500元宝</button></div><div class="hero-meta" style="margin-top:8px">累计抽取 ${fmt(state.kungfu?.drawCount||0)} 次 · 功法残页 ${fmt(state.kungfu?.fragments||0)}</div></section>
           <div class="section-title"><h3>红色功法</h3><small>25门</small></div><div class="hero-list">${redKungfuCards()}</div>
           <div class="section-title" style="margin-top:18px"><h3>神级融合功法</h3><small>13门</small></div><div class="hero-list">${divineCards()}</div>`;
          }'''
          s,n=re.subn(r"function renderKungfuPanel\(\)\{.*?\n\}\nfunction formatRemain",panel+"\nfunction formatRemain",s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'panel replace={n}')
          s=s.replace('V0.19 · 手机优先 · 本地存档','V0.21 · 手机优先 · 本地存档')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=one(s,'单机精简版 · V0.20','单机精简版 · V0.21','index version'); p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=one(s,"const CACHE = 'xinyitian-v0.20.1';","const CACHE = 'xinyitian-v0.21.0';",'cache')
          anchor="  './assets/original/jianghu-bg.jpg',\n"
          add="  './assets/original/icon-gems.png',\n  './assets/original/icon-copper.png',\n  './assets/original/icon-stamina.png',\n"
          s=one(s,anchor,anchor+add,'sw icons'); p.write_text(s,encoding='utf-8')

          p=Path('styles.css'); s=p.read_text(encoding='utf-8')
          if '/* V0.21 原版场景与资源图标 */' in s: raise SystemExit('css block exists')
          bg={k:os.environ[k] for k in ('HOME_BG_B64','GROWTH_BG_B64','CHALLENGE_BG_B64')}
          css=f'''\n/* V0.21 原版场景与资源图标 */
          .resource-item{{display:flex;align-items:center;gap:6px}}
          .resource-copy{{display:block;min-width:0}}
          .resource-icon{{width:22px;height:22px;object-fit:contain;flex:0 0 22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}}
          .page[data-page="home"],.page[data-page="growth"],.page[data-page="challenge"]{{isolation:isolate}}
          .page[data-page="home"]::before,.page[data-page="growth"]::before,.page[data-page="challenge"]::before{{content:"";position:fixed;z-index:-2;inset:93px 0 calc(58px + env(safe-area-inset-bottom));background-position:center top;background-size:cover;background-repeat:no-repeat;pointer-events:none}}
          .page[data-page="home"]::before{{background-image:linear-gradient(180deg,rgba(9,11,10,.18),rgba(9,11,10,.76) 84%),url('data:image/webp;base64,{bg['HOME_BG_B64']}');opacity:.62}}
          .page[data-page="growth"]::before{{background-image:linear-gradient(180deg,rgba(6,16,18,.20),rgba(8,12,11,.80) 82%),url('data:image/webp;base64,{bg['GROWTH_BG_B64']}');opacity:.62}}
          .page[data-page="challenge"]::before{{background-image:linear-gradient(180deg,rgba(18,12,8,.14),rgba(12,9,7,.70) 86%),url('data:image/webp;base64,{bg['CHALLENGE_BG_B64']}');opacity:.68}}
          .page[data-page="home"] .card,.page[data-page="growth"] .card,.page[data-page="challenge"] .card{{backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);background-color:rgba(17,18,15,.84)}}
          .page[data-page="growth"] .kungfu-main-card{{background:linear-gradient(145deg,rgba(22,34,31,.90),rgba(17,22,20,.89));border-color:rgba(205,169,91,.42)}}
          .page[data-page="challenge"] .card{{background:linear-gradient(145deg,rgba(45,34,24,.88),rgba(23,20,16,.91))}}
          .kungfu-slot.open{{border-color:rgba(218,180,92,.72);background:radial-gradient(circle at 80% 0,rgba(215,174,82,.12),transparent 48%),rgba(20,21,17,.94);box-shadow:inset 0 0 0 1px rgba(245,213,136,.05)}}
          .kungfu-slot.open .muted{{color:#c2a66f}}
          .kungfu-slot.locked{{opacity:.34;border-style:dashed}}
          @media(max-width:430px){{.resource-icon{{width:19px;height:19px;flex-basis:19px}}.resource-item{{min-width:74px;padding-left:8px;padding-right:8px}}}}
          '''
          p.write_text(s+css,encoding='utf-8')
          PY

      - name: Check V0.21
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          cp src/meridians.js /tmp/meridians.mjs
          node --input-type=module <<'JS'
          import {kungfuSlotsForTalent} from 'file:///tmp/meridians.mjs';
          for(const [t,w] of [[0,0],[219,0],[220,3],[260,3],[279,3],[280,4],[340,5],[400,6],[460,7],[520,8]]) if(kungfuSlotsForTalent(t)!==w) throw new Error(`${t}`);
          JS
          grep -q '天赋 ${fmt(talent)} · 已开 ${slots}/8槽' src/app.js
          grep -q '第${i+1}槽 · ${locked?'"'"'未解锁'"'"':'"'"'已解锁'"'"'}' src/app.js
          grep -q 'normalizeHeroKungfuStates' src/state.js
          grep -q 'data:image/webp;base64' styles.css
          grep -q 'icon-gems.png' src/app.js
          grep -q "xinyitian-v0.21.0" sw.js
          grep -q '单机精简版 · V0.21' index.html
          for f in assets/original/icon-gems.png assets/original/icon-copper.png assets/original/icon-stamina.png; do file "$f" | grep -q 'PNG image data, 60 x 60'; done
          rm -rf scripts/__pycache__
          test ! -d scripts/__pycache__

      - name: Commit and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v021-original-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: V0.21 original UI and talent slots'
          git push origin main
