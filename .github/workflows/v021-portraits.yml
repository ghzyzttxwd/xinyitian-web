name: V0.21 Original Hero Portraits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v021-portraits.yml'

permissions:
  contents: write

jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert original ASTC portraits
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/astcenc.zip 'https://github.com/ARM-software/astc-encoder/releases/download/5.7.0/astcenc-5.7.0-linux-x64.zip'
          echo '6c6b299b17608e1ee74db9c491cdc793b12b2b104a4b52222e358d78ae0662a9  /tmp/astcenc.zip' | sha256sum -c -
          unzip -q /tmp/astcenc.zip -d /tmp/astcenc
          ASTC=$(find /tmp/astcenc -type f -name 'astcenc-sse2' | head -1)
          test -n "$ASTC"
          chmod +x "$ASTC"
          mkdir -p assets/original
          "$ASTC" -ds tmp/original/player.ktx assets/original/portrait-player.png
          "$ASTC" -ds tmp/original/wuji.ktx assets/original/portrait-wuji.png
          "$ASTC" -ds tmp/original/xiaozhao.ktx assets/original/portrait-xiaozhao.png
          "$ASTC" -ds tmp/original/zhangsanfeng.ktx assets/original/portrait-zhangsanfeng.png

      - name: Wire portraits into UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/app.js'); s=app.read_text()
          anchor="const baseTalentOf=id=>baseTalentForHero(id);\n"
          insert="""const baseTalentOf=id=>baseTalentForHero(id);\nconst HERO_PORTRAITS=Object.freeze({player:'portrait-player.png',wuji:'portrait-wuji.png',xiaozhao:'portrait-xiaozhao.png',zhangsanfeng:'portrait-zhangsanfeng.png'});\nfunction heroPortraitHtml(id,size='card'){const file=HERO_PORTRAITS[id],p=profileOf(id)||HEROES[id],name=p?.name||'侠客',rarity=Number(p?.rarity||0);return `<div class=\\"hero-portrait hero-portrait-${size} rarity-frame-${rarity} ${file?'':'fallback'}\\">${file?`<img src=\\"./assets/original/${file}\\" alt=\\"${name}\\">`:`<span>${name.slice(0,1)}</span>`}</div>`;}\n"""
          if s.count(anchor)!=1: raise SystemExit('portrait helper anchor mismatch')
          s=s.replace(anchor,insert,1)
          old='function partyHtml(){return state.party.map((id,index)=>{if(!id)return `<div class="party-slot empty">${index+1}号位</div>`;const tpl=profileOf(id),h=state.heroes[id];return `<div class="party-slot"><div class="hero-name rarity-${tpl.rarity}">${tpl.name}</div><div class="hero-meta">Lv.${h.level} · ${tpl.role}</div><div class="hero-meta">战力 ${fmt(heroPower(state,id))}</div></div>`;}).join(\'\');}'
          new='function partyHtml(){return state.party.map((id,index)=>{if(!id)return `<div class="party-slot empty">${index+1}号位</div>`;const tpl=profileOf(id),h=state.heroes[id];return `<div class="party-slot"><div class="party-hero-row">${heroPortraitHtml(id,\'party\')}<div class="party-hero-copy"><div class="hero-name rarity-${tpl.rarity}">${tpl.name}</div><div class="hero-meta">Lv.${h.level} · ${tpl.role}</div><div class="hero-meta">战力 ${fmt(heroPower(state,id))}</div></div></div></div>`;}).join(\'\');}'
          if s.count(old)!=1: raise SystemExit('partyHtml mismatch')
          s=s.replace(old,new,1)
          pattern=r"function heroCard\(id\)\{\n const base=.*?\n return `.*?`;\n\}"
          replacement='''function heroCard(id){
 const base=HEROES[id],tpl=profileOf(id),h=state.heroes[id],owned=h?.owned,inParty=state.party.includes(id),unlockText=base.recruit?.type==='vip8'?'VIP8礼包':base.unlock?`第${base.unlock}幕开放`:(id==='xiaozhao'?'首充6元':'初始/活动'),s=owned?heroStats(state,id):null,talent=heroTalent(state,id);
 return `<div class="hero-card rarity-card-${tpl.rarity} ${owned?'':'locked'}"><div class="hero-card-row"><div class="hero-card-main">${heroPortraitHtml(id,'card')}<div class="hero-card-copy"><div class="hero-name rarity-${tpl.rarity}">${tpl.name} <span class="tag">${rarityName(tpl.rarity)}</span></div><div class="hero-meta">${tpl.role} · ${owned?`Lv.${h.level} · 战力 ${fmt(heroPower(state,id))}`:unlockText}</div>${s?`<div class="hero-meta">攻 ${fmt(s.atk)} · 防 ${fmt(s.def)} · 血 ${fmt(s.hp)} · 天赋 ${talent}</div>`:''}${owned&&awakeningConfig(id)?`<div class="hero-meta">${h.awakened?awakeningConfig(id).desc:`神品魂石：${fmt(state.awakening?.stones?.[id]||0)} · 碎片 ${fmt(state.awakening?.fragments?.[id]||0)}/${SOUL_SHARDS_PER_STONE}`}</div>`:''}</div></div><div class="action-stack">${owned?`<div class="action-row"><button class="btn" data-level-hero="${id}">升级</button><button class="btn ${inParty?'btn-gold':''}" data-toggle-party="${id}">${inParty?'下阵':'上阵'}</button></div>${awakeningHeroAction(id)}`:recruitStatusHtml(id)}</div></div></div>`;
}'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'heroCard replace count={n}')
          app.write_text(s)
          css=Path('styles.css'); c=css.read_text()
          if 'V0.21.2：原版侠客头像首批' in c: raise SystemExit('portrait css already present')
          c+='''\n\n/* V0.21.2：原版侠客头像首批；边框为网页端按品质适配。 */\n.hero-card-main{display:flex;align-items:center;gap:10px;min-width:0}\n.hero-card-copy,.party-hero-copy{min-width:0}\n.hero-portrait{position:relative;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;background:radial-gradient(circle,#443524,#171814 72%);border:2px solid rgba(199,157,84,.5);box-shadow:0 2px 8px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.05)}\n.hero-portrait-card{width:58px;height:58px;border-radius:8px}\n.hero-portrait-party{width:46px;height:46px;border-radius:7px}\n.hero-portrait img{width:100%;height:100%;display:block;object-fit:cover}\n.hero-portrait.fallback span{font-family:"STKaiti","KaiTi",serif;font-size:22px;color:#d9bd80}\n.hero-portrait.rarity-frame-7{border-color:#f1c85d;box-shadow:0 0 0 1px rgba(255,211,102,.28),0 2px 9px rgba(0,0,0,.42)}\n.hero-portrait.rarity-frame-6{border-color:#b95445}\n.hero-portrait.rarity-frame-5{border-color:#9969b5}\n.party-hero-row{display:flex;align-items:center;gap:7px;min-width:0}\n@media(max-width:430px){.hero-card-main{align-items:flex-start}.party-hero-row{display:block}.hero-portrait-party{margin:0 auto 5px}}\n'''
          css.write_text(c)
          sw=Path('sw.js'); w=sw.read_text()
          if 'xinyitian-v0.21.1' not in w: raise SystemExit('unexpected service worker version')
          w=w.replace('xinyitian-v0.21.1','xinyitian-v0.21.2',1)
          anchor="  './assets/original/icon-stamina.png',"
          repl="  './assets/original/icon-stamina.png',\n  './assets/original/portrait-player.png',\n  './assets/original/portrait-wuji.png',\n  './assets/original/portrait-xiaozhao.png',\n  './assets/original/portrait-zhangsanfeng.png',"
          if w.count(anchor)!=1: raise SystemExit('service worker asset anchor mismatch')
          sw.write_text(w.replace(anchor,repl,1))
          PY

      - name: Validate generated portraits and code
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          file assets/original/portrait-player.png | grep -F 'PNG image data, 140 x 140'
          file assets/original/portrait-wuji.png | grep -F 'PNG image data, 140 x 140'
          file assets/original/portrait-xiaozhao.png | grep -F 'PNG image data, 160 x 160'
          file assets/original/portrait-zhangsanfeng.png | grep -F 'PNG image data, 140 x 140'
          grep -Fq 'portrait-player.png' src/app.js
          grep -Fq 'xinyitian-v0.21.2' sw.js

      - name: Commit portraits and clean temporary inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/original
          rm -f .github/workflows/v021-portraits.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add first original hero portraits'
          git push origin main
