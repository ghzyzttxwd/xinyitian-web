name: V0.21.4 Mobile Regression 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0214-browser-regression2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq 'xinyitian-v0.21.4' sw.js
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyt-pw && cd /tmp/xyt-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run corrected mobile regression
        shell: bash
        run: |
          set +e
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          echo '' | base64 -d | gunzip > /tmp/xyt-pw/test.cjs
          cd /tmp/xyt-pw
          node test.cjs >/tmp/v0214-test.log 2>&1
          STATUS=$?
          kill $SERVER_PID >/dev/null 2>&1 || true
          echo "$STATUS" >/tmp/v0214-status
          exit 0
      - name: Record result and clean workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(cat /tmp/v0214-status 2>/dev/null || echo 99)
          rm -f .github/workflows/v0214-browser-regression2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$STATUS" = "0" ]; then
            rm -f docs/v0214-regression-failure.txt
            git add -A
            git commit -m 'test: V0.21.4 mobile regression passed'
          else
            mkdir -p docs
            { echo "V0.21.4 regression exit=$STATUS"; tail -c 12000 /tmp/v0214-test.log 2>/dev/null || true; } > docs/v0214-regression-failure.txt
            git add -A
            git commit -m 'test: capture V0.21.4 regression failure 2'
          fi
          git push origin main
