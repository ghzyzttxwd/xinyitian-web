name: V0.21.4 Kungfu Modal and Rage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0214-kungfu-modal-rage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V0.21.4 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq 'data-choose-kungfu-slot="${i}"' src/app.js
          grep -Fq 'data-open-kungfu="${ref}"' src/app.js
          grep -Fq 'data-modal-upgrade-kungfu' src/app.js
          grep -Fq 'initialRage:2+Number(ip.initialRage||0)' src/state.js
          grep -Fq 'actor.rage=Math.min(8,actor.rage+2)' src/battle.js
          grep -Fq 'xinyitian-v0.21.4' sw.js

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyt-pw && cd /tmp/xyt-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify mobile UX and rage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          echo '' | base64 -d | gunzip > /tmp/xyt-pw/test.cjs
          cd /tmp/xyt-pw && node test.cjs

      - name: Commit verified patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0214-kungfu-modal-rage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/state.js src/battle.js styles.css sw.js .github/workflows/v0214-kungfu-modal-rage.yml
          git commit -m 'feat: add kungfu subpage and correct base rage'
          git push origin main
