name: V0.21.5 Mobile Scene Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0215-browser-regression.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq './scenes.css' index.html
          grep -Fq 'formation-bg.webp' scenes.css
          grep -Fq 'kungfu-bg.webp' scenes.css
          grep -Fq 'challenge-bg.webp' scenes.css
          grep -Fq 'xinyitian-v0.21.5' sw.js
          test "$(git hash-object assets/original/formation-bg.webp)" = "25dc6c4fada0d961ef55da7d49b374907e4ecc90"
          test "$(git hash-object assets/original/kungfu-bg.webp)" = "287791b85f0dac07184d7cff3e2c5e75d7e6a821"
          test "$(git hash-object assets/original/challenge-bg.webp)" = "c745fc1109868144c8b1b4ef8e4343e16245f83d"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyt-pw && cd /tmp/xyt-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run 390px regression
        shell: bash
        run: |
          set +e
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xyt-http.log 2>&1 &
          SERVER_PID=$!
          cat >/tmp/xyt-pw/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const A=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});

            const formation=page.locator('#page[data-page="home"] .card:has(.party-grid)');
            A(await formation.count()===1,'formation card missing');
            let bg=await formation.evaluate(e=>getComputedStyle(e).backgroundImage);
            A(bg.includes('formation-bg.webp'),`formation background missing: ${bg}`);
            const cols=await page.locator('#page[data-page="home"] .party-grid').evaluate(e=>getComputedStyle(e).gridTemplateColumns.split(' ').filter(Boolean).length);
            A(cols===2,`formation expected 2 columns, got ${cols}`);

            const resources=await page.evaluate(()=>{const b=document.querySelector('#resourceBar'),a=[...b.children];return{rows:new Set(a.map(x=>x.offsetTop)).size,overflow:b.scrollWidth>b.clientWidth}});
            A(resources.rows===2&&!resources.overflow,`resource bar regression ${JSON.stringify(resources)}`);

            await page.click('.nav-item[data-page="growth"]');
            await page.click('[data-growth-tab="kungfu"]');
            const growth=page.locator('#page[data-page="growth"]');
            bg=await growth.evaluate(e=>getComputedStyle(e).backgroundImage);
            A(bg.includes('kungfu-bg.webp'),`kungfu background missing: ${bg}`);
            const choose=page.locator('[data-choose-kungfu-slot]').first();
            if(await choose.count()){
              await choose.click();
              A(await page.locator('#genericDialog').evaluate(e=>e.open),'kungfu secondary page failed to open');
              const ratio=await page.locator('#genericDialog').evaluate(e=>e.getBoundingClientRect().height/window.innerHeight);
              A(ratio>.60&&ratio<.74,`kungfu secondary page height ${ratio}`);
              await page.click('#genericDialog [data-close-generic]');
            }

            await page.click('.nav-item[data-page="challenge"]');
            const challenge=page.locator('#page[data-page="challenge"]');
            bg=await challenge.evaluate(e=>getComputedStyle(e).backgroundImage);
            A(bg.includes('challenge-bg.webp'),`challenge background missing: ${bg}`);

            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
            A(!overflow,'document has horizontal overflow');
            for(const file of ['formation-bg.webp','kungfu-bg.webp','challenge-bg.webp']){
              const ok=await page.evaluate(async f=>(await fetch('./assets/original/'+f)).ok,file);
              A(ok,`asset fetch failed ${file}`);
            }
            A(errors.length===0,`page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          cd /tmp/xyt-pw
          node test.cjs >/tmp/v0215-test.log 2>&1
          STATUS=$?
          kill $SERVER_PID >/dev/null 2>&1 || true
          echo "$STATUS" >/tmp/v0215-status
          exit 0

      - name: Record result and clean workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(cat /tmp/v0215-status 2>/dev/null || echo 99)
          rm -f .github/workflows/v0215-browser-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$STATUS" = "0" ]; then
            rm -f docs/v0215-regression-failure.txt
            git add -A
            git commit -m 'test: V0.21.5 mobile scene regression passed'
          else
            mkdir -p docs
            { echo "V0.21.5 regression exit=$STATUS"; tail -c 12000 /tmp/v0215-test.log 2>/dev/null || true; } > docs/v0215-regression-failure.txt
            git add -A
            git commit -m 'test: capture V0.21.5 scene regression failure'
          fi
          git push origin main
