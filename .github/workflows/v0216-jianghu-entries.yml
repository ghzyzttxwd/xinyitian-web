name: V0.21.6 Jianghu Entries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0216-jianghu-entries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navigation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          for f in src/*.js sw.js; do node --check "$f"; done
          grep -Fq "['mainline','主','主线'" src/app.js
          grep -Fq "['tower','塔','少林千宝塔'" src/app.js
          grep -Fq "renderMoreMainline" src/app.js
          grep -Fq "renderMoreTower" src/app.js
          grep -Fq "xinyitian-v0.21.6" sw.js
          grep -Fq 'data-more="tower"' scenes.css
          ! grep -Fq 'data-page-jump="challenge">去挑战' src/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0216-jianghu-entries.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: move mainline tower recharge into jianghu entries'
          git push origin main
