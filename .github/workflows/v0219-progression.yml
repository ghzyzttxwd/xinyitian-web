name: V0.21.9 Original Progression

on:
  page_build:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v580 progression
        run: python scripts/v0219_patch.py

      - name: Syntax and data regression
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          node --input-type=module <<'NODE'
          import {playerExpToNext,requiredPlayerLevelForChapter} from './src/data.js';
          import {originalChapterReward,originalSweepReward,roleMaxExp} from './src/progression.js';
          import {GROWTH_TASKS} from './src/tasks.js';
          const eq=(a,b,msg)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(`${msg}: ${JSON.stringify(a)} != ${JSON.stringify(b)}`);};
          eq(playerExpToNext(29),80000,'Lv29->30');
          eq(playerExpToNext(50),1060000,'Lv50->51');
          eq(roleMaxExp(240),513000000,'rolelv row240');
          eq(requiredPlayerLevelForChapter(10),17,'chapter10 gate');
          eq(requiredPlayerLevelForChapter(20),30,'chapter20 gate');
          eq(requiredPlayerLevelForChapter(50),60,'chapter50 gate');
          eq(requiredPlayerLevelForChapter(100),110,'chapter100 gate');
          eq(originalChapterReward(20),{exp:26000,heroExp:20000,copper:40000,fights:4},'chapter20 reward');
          eq(originalChapterReward(100),{exp:279000,heroExp:108000,copper:216000,fights:6},'chapter100 reward');
          eq(originalSweepReward(29),{exp:5800,heroExp:2100,copper:0},'lv29 sweep');
          eq(GROWTH_TASKS.reduce((sum,x)=>sum+x.exp,0),1718000,'growth task exp');
          console.log('V0.21.9 progression regression passed');
          NODE
          grep -F "const original=originalChapterReward(chapter)" src/app.js
          grep -F "const one=originalSweepReward(state.player.level)" src/app.js
          ! grep -F "const exp=180+chapter*36" src/app.js
          ! grep -F "oneExp=260+state.player.chapter*44" src/app.js
          grep -F "xinyitian-v0.21.9" sw.js

      - name: Commit and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0219-progression.yml scripts/v0219_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align player progression with v580'
          git push
