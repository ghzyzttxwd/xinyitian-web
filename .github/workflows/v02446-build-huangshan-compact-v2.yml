name: V02446 Huangshan File Audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'V0.24.46 audit Huangshan source files runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit every required official file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='https://xyttlj-static.xyimg.net/game/'
          files=[]
          for act,ver in [('stand',1),('run',1),('att1',1),('att2',2),('hit1',1)]:
              stem=f'resself/model/role/{act}/1000018_v{ver}'
              files += [stem+'.png',stem+'.cfg']
          for i in range(102,118):
              stem=f'resself/model/magic/atlas/491045{i}_v2'
              files += [stem+'.png',stem+'.cfg']
          files += ['res/icon/skillname/4010451_v2.png','resself/sound/4910451_v2.mp3']
          out=[]; bad=[]
          for rel in files:
              r=subprocess.run(['curl','-L','--max-time','20','-A','Mozilla/5.0','-sS','-o','/tmp/xytprobe','-w','%{http_code}\t%{size_download}\t%{content_type}',base+rel],capture_output=True,text=True)
              line=f'{r.stdout.strip()}\t{rel}\texit={r.returncode}'
              out.append(line)
              parts=r.stdout.strip().split('\t')
              if r.returncode or not parts or parts[0]!='200' or len(parts)<2 or int(float(parts[1] or 0))<=0: bad.append(rel)
          out.append(f'TOTAL={len(files)} BAD={len(bad)}')
          if bad:
              out.append('BAD_FILES:')
              out.extend(bad)
          Path('.v02446-huangshan-file-audit.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit audit and remove runner
        shell: bash
        run: |
          rm -f .github/workflows/v02446-build-huangshan-compact-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'V0.24.46 record Huangshan source file audit'
          git push
