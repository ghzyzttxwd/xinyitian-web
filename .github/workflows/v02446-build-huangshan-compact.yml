name: V02446 CDN Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'V0.24.46 diagnose official CDN runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose official CDN
        shell: bash
        run: |
          set +e
          OUT=.v02446-cdn-diagnostic.txt
          : > "$OUT"
          echo "date=$(date -u +%FT%TZ)" >> "$OUT"
          echo "dns:" >> "$OUT"
          getent hosts xyttlj-static.xyimg.net >> "$OUT" 2>&1
          echo "dns_exit=$?" >> "$OUT"
          for U in \
            'https://xyttlj-static.xyimg.net/game/resself/model/role/stand/1000018_v1.png' \
            'https://xyttlj-static.xyimg.net/game/resself/model/role/stand/1000012_v1.png' \
            'http://xyttlj-static.xyimg.net/game/resself/model/role/stand/1000018_v1.png'; do
            echo "--- $U" >> "$OUT"
            curl -L --max-time 15 -A 'Mozilla/5.0' -o /tmp/probe.bin -sS -w 'http=%{http_code} size=%{size_download} remote=%{remote_ip} error=%{errormsg}\n' "$U" >> "$OUT" 2>&1
            echo "curl_exit=$?" >> "$OUT"
            if [ -f /tmp/probe.bin ]; then file /tmp/probe.bin >> "$OUT" 2>&1; rm -f /tmp/probe.bin; fi
          done
          cat "$OUT"
      - name: Commit diagnostic and remove runner
        shell: bash
        run: |
          rm -f .github/workflows/v02446-build-huangshan-compact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'V0.24.46 record official CDN diagnostic'
          git push
