name: V02446 Finalize Huangshan Compact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'V0.24.46 finalize Huangshan compact runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download official Huangshan source files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/huangshan-src"
          mkdir -p "$ROOT"
          BASE='https://xyttlj-static.xyimg.net/game/'
          get(){
            rel="$1"
            mkdir -p "$ROOT/$(dirname "$rel")"
            curl -fL --retry 3 --retry-delay 1 --connect-timeout 15 --max-time 90 \
              -A 'Mozilla/5.0' "$BASE$rel" -o "$ROOT/$rel"
            test -s "$ROOT/$rel"
          }
          for spec in 'stand 1' 'run 1' 'att1 1' 'att2 2' 'hit1 1'; do
            set -- $spec
            get "resself/model/role/$1/1000018_v$2.png"
            get "resself/model/role/$1/1000018_v$2.cfg"
          done
          for i in $(seq 102 117); do
            get "resself/model/magic/atlas/491045${i}_v2.png"
            get "resself/model/magic/atlas/491045${i}_v2.cfg"
          done
          get 'res/icon/skillname/4010451_v2.png'
          get 'resself/sound/4910451_v2.mp3'
          echo "HUANG_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Repack official frames for mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, os

          ROOT=Path(os.environ['HUANG_ROOT'])
          OUT=Path('assets/original/huangshan-1000018')
          OUT.mkdir(parents=True,exist_ok=True)

          def parse_cfg(path):
              b=Path(path).read_bytes()
              n=int.from_bytes(b[:2],'big')
              out=[]
              if len(b) < 2+n*12:
                  raise RuntimeError(f'truncated cfg {path}')
              for i in range(n):
                  p=2+i*12
                  out.append((
                      int.from_bytes(b[p:p+2],'big',signed=True),
                      int.from_bytes(b[p+2:p+4],'big',signed=True),
                      int.from_bytes(b[p+4:p+6],'big'),
                      int.from_bytes(b[p+6:p+8],'big'),
                      int.from_bytes(b[p+8:p+10],'big'),
                      int.from_bytes(b[p+10:p+12],'big'),
                  ))
              return out

          def scaled_frames(png,cfg,scale):
              im=Image.open(png).convert('RGBA')
              out=[]
              for ox,oy,w,h,x,y in parse_cfg(cfg):
                  if w<=0 or h<=0 or x+w>im.width or y+h>im.height:
                      raise RuntimeError(f'bad frame bounds {png}: {(x,y,w,h)} / {im.size}')
                  crop=im.crop((x,y,x+w,y+h))
                  sw=max(1,round(w*scale)); sh=max(1,round(h*scale))
                  if (sw,sh)!=(w,h):
                      crop=crop.resize((sw,sh),Image.Resampling.LANCZOS)
                  out.append({'ox':ox*scale,'oy':oy*scale,'w':sw,'h':sh,'img':crop})
              return out

          def pack(sheets,atlas_width,out_file):
              pad=2;x=pad;y=pad;row_h=0;placements={}
              items=[]
              for key,frames in sheets.items():
                  for idx,f in enumerate(frames):
                      items.append((key,idx,f))
              items=sorted(items,key=lambda t:(-t[2]['h'],-t[2]['w'],t[0],t[1]))
              for key,idx,f in items:
                  if x+f['w']+pad>atlas_width:
                      x=pad;y+=row_h+pad;row_h=0
                  placements[(key,idx)]=(x,y)
                  x+=f['w']+pad;row_h=max(row_h,f['h'])
              H=y+row_h+pad
              if H%2:H+=1
              atlas=Image.new('RGBA',(atlas_width,H),(0,0,0,0))
              for key,frames in sheets.items():
                  for idx,f in enumerate(frames):
                      px,py=placements[(key,idx)]
                      atlas.alpha_composite(f['img'],(px,py))
              atlas.save(out_file,'WEBP',quality=82,method=6)
              return atlas.size

          role={}
          for act,ver in [('stand',1),('run',1),('att1',1),('att2',2),('hit1',1)]:
              stem=ROOT/f'resself/model/role/{act}/1000018_v{ver}'
              role[act]=scaled_frames(str(stem)+'.png',str(stem)+'.cfg',.42)
          magic={}
          for i in range(102,118):
              stem=ROOT/f'resself/model/magic/atlas/491045{i}_v2'
              magic[f'm{i}']=scaled_frames(str(stem)+'.png',str(stem)+'.cfg',.22)

          rsize=pack(role,1024,OUT/'role-q82.webp')
          msize=pack(magic,2048,OUT/'magic-q82.webp')
          if rsize!=(1024,944): raise RuntimeError(f'role atlas geometry drift: {rsize}')
          if msize!=(2048,1130): raise RuntimeError(f'magic atlas geometry drift: {msize}')

          (OUT/'skillname.png').write_bytes((ROOT/'res/icon/skillname/4010451_v2.png').read_bytes())
          (OUT/'4910451.mp3').write_bytes((ROOT/'resself/sound/4910451_v2.mp3').read_bytes())
          for name in ['role-q82.webp','magic-q82.webp','skillname.png','4910451.mp3']:
              p=OUT/name
              if p.stat().st_size<=0: raise RuntimeError('empty '+name)
              print(name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          decoded=(1024*944+2048*1130)*4
          print('decoded_rgba_mb',decoded/1024/1024)
          if decoded>14*1024*1024: raise RuntimeError('decoded memory budget exceeded')
          PY
      - name: Update V0.24.46 entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'V0.24.45' not in s or 'xyt-cache-reset-02445' not in s:
              raise RuntimeError('index is not the expected V0.24.45 baseline')
          s=s.replace('02445','02446')
          css='  <link rel="stylesheet" href="./battle-huangshan-v02446.css?v=02446" />\n'
          css_anchor='  <link rel="stylesheet" href="./battle-wuji-original-v02441.css?v=02446" />\n'
          if css not in s:
              if css_anchor not in s: raise RuntimeError('CSS anchor missing')
              s=s.replace(css_anchor,css_anchor+css,1)
          js='  <script type="module" src="./src/v02446-huangshan-compact.js?v=02446"></script>\n'
          js_anchor='  <script type="module" src="./src/v02441-wuji-original-ultimate.js?v=02446"></script>\n'
          if js not in s:
              if js_anchor not in s: raise RuntimeError('JS anchor missing')
              s=s.replace(js_anchor,js_anchor+js,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify runtime and Android stability guard
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v02430-battle-visual.js
          node --check src/v02446-huangshan-compact.js
          grep -F "rootObserver.observe(battleBody,{childList:true,subtree:true})" src/v02446-huangshan-compact.js
          grep -F "if(target?.id==='battleDialogBody'&&next.attributes)" index.html
          grep -F "if(target?.id==='page')next.subtree=false" index.html
          grep -F 'V0.24.46' index.html
          grep -F 'xyt-cache-reset-02446' index.html
          grep -F 'v02446-huangshan-compact.js?v=02446' index.html
          grep -F 'battle-huangshan-v02446.css?v=02446' index.html
          test -s assets/original/huangshan-1000018/role-q82.webp
          test -s assets/original/huangshan-1000018/magic-q82.webp
      - name: Clean temporary diagnostics and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/v02446-build-huangshan-compact.yml \
            .github/workflows/v02446-build-huangshan-compact-v2.yml \
            .github/workflows/v02446-install-streaming-huangshan.yml \
            .github/workflows/v02446-finalize-huangshan.yml \
            .v02446-cdn-diagnostic.txt \
            .v02446-huangshan-file-audit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'V0.24.46 enable mobile-safe official Huangshan ultimate'
          git push
