name: Verify Live V0.21.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-v0213.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public GitHub Pages output
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghzyzttxwd.github.io/xinyitian-web'
          ok=0
          for i in {1..24}; do
            q="$GITHUB_RUN_ID-$i"
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base/src/app.js?v=$q" -o /tmp/app.js && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/styles.css?v=$q" -o /tmp/styles.css && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/sw.js?v=$q" -o /tmp/sw.js && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/figure-player.webp?v=$q" -o /tmp/player.webp && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/figure-wuji.webp?v=$q" -o /tmp/wuji.webp && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/figure-zhangsanfeng.webp?v=$q" -o /tmp/zsf.webp && \
               grep -Fq 'data-action="chooseKungfu"' /tmp/app.js && \
               grep -Fq '装备到空槽' /tmp/app.js && \
               grep -Fq 'data-hero-id="${id}"' /tmp/app.js && \
               grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' /tmp/styles.css && \
               grep -Fq 'figure-player.webp' /tmp/styles.css && \
               grep -Fq 'xinyitian-v0.21.3' /tmp/sw.js && \
               file /tmp/player.webp | grep -Fq 'Web/P image' && \
               file /tmp/wuji.webp | grep -Fq 'Web/P image' && \
               file /tmp/zsf.webp | grep -Fq 'Web/P image'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
      - name: Remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-live-v0213.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove V0.21.3 live verifier'
          git push origin main
