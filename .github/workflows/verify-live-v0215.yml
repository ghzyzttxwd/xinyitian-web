name: Verify Live V0.21.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-v0215.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghzyzttxwd.github.io/xinyitian-web'
          ok=0
          for i in {1..24}; do
            q="$GITHUB_RUN_ID-$i"
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base/index.html?v=$q" -o /tmp/index.html && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/scenes.css?v=$q" -o /tmp/scenes.css && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/sw.js?v=$q" -o /tmp/sw.js && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/formation-bg.webp?v=$q" -o /tmp/formation.webp && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/kungfu-bg.webp?v=$q" -o /tmp/kungfu.webp && \
               curl -fsSL --connect-timeout 10 --max-time 30 "$base/assets/original/challenge-bg.webp?v=$q" -o /tmp/challenge.webp && \
               grep -Fq './scenes.css' /tmp/index.html && \
               grep -Fq 'formation-bg.webp' /tmp/scenes.css && \
               grep -Fq 'kungfu-bg.webp' /tmp/scenes.css && \
               grep -Fq 'challenge-bg.webp' /tmp/scenes.css && \
               grep -Fq 'xinyitian-v0.21.5' /tmp/sw.js && \
               file /tmp/formation.webp | grep -Fq 'Web/P image' && \
               file /tmp/kungfu.webp | grep -Fq 'Web/P image' && \
               file /tmp/challenge.webp | grep -Fq 'Web/P image'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
      - name: Remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-live-v0215.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove V0.21.5 live verifier'
          git push origin main
