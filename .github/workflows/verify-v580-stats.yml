name: Verify V580 Hero Stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v580-stats.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax checks
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
      - name: Verify v580 stat chain
        run: |
          set -euo pipefail
          cat > /tmp/check-stats.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { HEROES } from './src/data.js';
          import { LEVEL_ATK, heroLevelFlatStats } from './src/levelstats.js';
          import { createInitialState, heroStats, heroKungfuBonuses, heroPower } from './src/state.js';

          assert.equal(LEVEL_ATK.length,240,'shengjisx must contain 240 levels');
          assert.deepEqual(heroLevelFlatStats(29),{atk:390,def:195,hp:1170});
          const anchors={
            xiaozhao:[4500,2250,13500],yangxiao:[30000,15000,90000],
            yangdingtian:[60000,30000,180000],guoxiang:[60000,30000,180000],
            huangshan:[60000,30000,180000],zhangsanfeng:[90000,45000,270000],
            duer:[90000,45000,270000],dunan:[90000,45000,270000],dujie:[90000,45000,270000],huiyue:[90000,45000,270000],
            yangguo:[105000,52500,315000],huangrong:[105000,52500,315000],xiaolongnv:[105000,52500,315000],guojing:[105000,52500,315000],zhoubotong:[105000,52500,315000]
          };
          for(const [id,[atk,def,hp]] of Object.entries(anchors)){
            assert.equal(HEROES[id].base.atk,atk,`${id} base atk`);
            assert.equal(HEROES[id].base.def,def,`${id} base def`);
            assert.equal(HEROES[id].base.hp,hp,`${id} base hp`);
          }

          const s=createInitialState();
          const h=s.heroes.huangshan; h.owned=true; h.level=29;
          let naked=heroStats(s,'huangshan');
          assert.equal(naked.atk,60390,'Huangshan Lv29 naked atk');
          assert.equal(naked.def,30195,'Huangshan Lv29 naked def');
          assert.equal(naked.hp,181170,'Huangshan Lv29 naked hp');
          const nakedPower=heroPower(s,'huangshan');

          s.kungfu.red['104001']={level:2,copies:0};
          h.kungfu.equipped[0]='104001';
          const k=heroKungfuBonuses(s,'huangshan');
          assert.equal(k.atk,18000,'Lv2 Zhenwu attack bonus');
          const geared=heroStats(s,'huangshan');
          assert.equal(geared.atk,78390,'Huangshan Lv29 + Lv2 Zhenwu atk');
          assert.equal(geared.atk-naked.atk,18000,'Zhenwu delta must be exactly 18000');
          assert.equal(geared.def,naked.def,'attack manual must not alter defense');
          assert.equal(geared.hp,naked.hp,'attack manual must not alter hp');
          const gearedPower=heroPower(s,'huangshan');
          assert.ok(gearedPower>nakedPower,'power must rise when +18000 atk is equipped');
          console.log(JSON.stringify({naked,geared,nakedPower,gearedPower,kungfuAtk:k.atk},null,2));
          JS
          cp /tmp/check-stats.mjs ./check-stats.mjs
          node check-stats.mjs
          rm check-stats.mjs
      - name: Verify cache
        run: |
          grep -Fq "xinyitian-v0.21.8" sw.js
          grep -Fq "./src/levelstats.js" sw.js
      - name: Remove verifier
        run: |
          rm -f .github/workflows/verify-v580-stats.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-v580-stats.yml
          git commit -m 'chore: remove v580 stat verifier'
          git push origin main
