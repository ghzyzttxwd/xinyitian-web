<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#15120f" />
  <title>新倚天屠龙记·单机精简版</title>
  <script>
  (()=>{
    const RESET_KEY='xyt-cache-reset-02413';
    if('serviceWorker' in navigator){
      if(!sessionStorage.getItem(RESET_KEY)){
        sessionStorage.setItem(RESET_KEY,'1');
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.filter(r=>String(r.scope||'').includes('/xinyitian-web/')).map(r=>r.unregister()))),
          ('caches' in window)?caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('xinyitian-')).map(k=>caches.delete(k)))):Promise.resolve()
        ]).then(()=>{
          const u=new URL(location.href);
          u.searchParams.set('_xyt','02413');
          location.replace(u.href);
        }).catch(()=>{});
      }
      try{navigator.serviceWorker.register=()=>Promise.resolve({});}catch{}
    }

    // Keep the V0.23.7 stability guard: battle polish may observe DOM insertion,
    // but must never observe animation class changes.
    const NativeMutationObserver=window.MutationObserver;
    if(NativeMutationObserver){
      window.MutationObserver=class XYTMutationObserver extends NativeMutationObserver{
        observe(target,options={}){
          const next={...options};
          if(target?.id==='battleDialogBody'&&next.attributes){
            next.attributes=false;
            delete next.attributeFilter;
            delete next.attributeOldValue;
          }
          if(target?.id==='page')next.subtree=false;
          return super.observe(target,next);
        }
      };
    }
  })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest?v=02413" />
  <link rel="stylesheet" href="./styles.css?v=02413" />
  <link rel="stylesheet" href="./scenes.css?v=02413" />
  <link rel="stylesheet" href="./jianghu-nav.css?v=02413" />
  <link rel="stylesheet" href="./mall-bulk.css?v=02413" />
  <link rel="stylesheet" href="./power-feedback.css?v=02413" />
  <link rel="stylesheet" href="./v02413-ui.css?v=02413" />
  <link rel="stylesheet" href="./battle-visual.css?v=02413" />
  <link rel="stylesheet" href="./battle-polish.css?v=02413" />
  <link rel="stylesheet" href="./battle-v240.css?v=02413" />
  <link rel="stylesheet" href="./battle-speed.css?v=02413" />
  <link rel="stylesheet" href="./battle-ultimate.css?v=02413" />
  <link rel="stylesheet" href="./battle-controls.css?v=02413" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand">新倚天屠龙记</div>
        <div class="subtitle">单机精简版 · V0.24.13</div>
      </div>
      <button id="saveStatus" class="save-status" type="button">已保存</button>
    </header>

    <section id="resourceBar" class="resource-bar" aria-label="资源栏"></section>

    <main id="page" class="page" aria-live="polite"></main>
    <script>
    (()=>{
      const page=document.querySelector('#page');
      if(!page)return;
      const guard=new MutationObserver(()=>{
        const el=page.querySelector('.game-info .hero-meta');
        if(el && /V0\.\d+/.test(el.textContent||'')){
          el.textContent='V0.24.13 · 手机优先 · 本地存档';
          el.classList.remove('hero-meta');
          el.classList.add('game-version-meta');
        }
      });
      guard.observe(page,{childList:true,subtree:true});
    })();
    </script>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-page="home" type="button"><span>首页</span></button>
      <button class="nav-item" data-page="heroes" type="button"><span>侠客</span></button>
      <button class="nav-item" data-page="growth" type="button"><span>养成</span></button>
      <button class="nav-item" data-page="challenge" type="button"><span>背包</span></button>
      <button class="nav-item" data-page="more" type="button"><span>江湖</span></button>
    </nav>
  </div>

  <div id="battleDialog" class="modal battle-modal" hidden>
    <div id="battleDialogBody"></div>
  </div>
  <div id="battleControlRail" class="battle-control-rail" hidden aria-label="战斗控制">
    <button type="button" data-rail-log>战报</button>
    <button type="button" data-rail-speed>1×</button>
    <button type="button" data-rail-skip>跳过</button>
    <button type="button" data-rail-close>退出</button>
  </div>

  <dialog id="genericDialog" class="modal">
    <div id="genericDialogBody"></div>
  </dialog>

  <input id="importSaveInput" type="file" accept="application/json,.json" hidden />

  <script src="./battle-dialog-shell.js?v=02413"></script>
  <script type="module" src="./src/v0245-fragments.js?v=02413"></script>
  <script type="module" src="./src/v0243-fixes.js?v=02413"></script>
  <script type="module" src="./src/app.js?v=02413"></script>
  <script type="module" src="./src/jianghu-nav.js?v=02413"></script>
  <script type="module" src="./src/v0249-meridian-shop.js?v=02413"></script>
  <script type="module" src="./src/v02411-kungfu-power.js?v=02413"></script>
  <script type="module" src="./src/v02412-kungfu-multi-rare.js?v=02413"></script>
  <script type="module" src="./src/v02413-weapons-ui.js?v=02413"></script>
  <script type="module" src="./src/battle-visual.js?v=02413"></script>
  <script type="module" src="./src/battle-ultimate.js?v=02413"></script>
  <script type="module" src="./src/battle-polish.js?v=02413"></script>
  <script type="module" src="./src/battle-input-fix.js?v=02413"></script>
</body>
</html>
